  - id: rusal_sanctions_2018
    title: 美国制裁俄铝
    start_date: 2018-04-06
    end_date: 2018-04-23
    location: 俄罗斯
    categories: [geopolitical, industry_supply_chain]
    summary: >-
      美国财政部把俄铝列入制裁名单，俄铝约占中国以外铝供应的一成多。
      铝价两周内急涨，4 月 23 日财政部延长缓冲期并表示可以解除制裁后
      急跌。制裁最终在 2019 年 1 月解除。
    observations:
      - asset: 伦敦铝
        direction: up
        window: 2w
        note: 两周内上涨约三成，4月19日前后升至七年高位
        recall: medium
      - asset: 俄铝（港股）
        direction: down
        window: 1d
        note: 4月9日单日下跌约 50%
        recall: high
      - asset: 伦敦铝
        direction: down
        window: 1d
        note: 4月23日缓冲期延长的消息后单日下跌 7% 以上
        recall: medium
      - asset: 氧化铝
        direction: up
        window: 2w
        note: 创历史新高
        recall: medium
      - asset: 俄罗斯以外的铝企（美国铝业等）
        direction: up
        window: 2w
        note: 受益于铝价上涨
        recall: medium
    lessons:
      - 制裁造成的涨价可以被一纸豁免瞬间逆转，政策本身就是失效条件
      - 被制裁方的上下游（氧化铝）反应可能比主产品更剧烈
    verification:
      status: web_checked
      checked_on: 2026-11-13
      sources:
        - "https://www.mining.com/web/us-sanctions-rusal-shatter-aluminiums-supply-chain-andy-home/"
        - "https://www.thestar.com.my/business/business-news/2018/04/24/aluminium-prices-extend-fall-after-us-reprieve-for-rusal"
        - "https://themoscowtimes.com/2019/01/28/us-lifts-sanctions-on-rusal-other-firms-linked-to-oligarch-deripaska-a64304"
      notes: "氧化铝的上涨同时受到巴西一家氧化铝厂减产的影响，不能只归因于制裁。"

  - id: indonesia_palm_oil_ban_2022
    title: 印尼棕榈油出口禁令
    start_date: 2022-04-22
    end_date: 2022-05-23
    location: 印度尼西亚
    categories: [macro_policy, industry_supply_chain]
    summary: >-
      全球最大的棕榈油出口国为平抑国内食用油价格宣布禁止出口，
      4 月 28 日生效，5 月 23 日解除。禁令的范围在一周内变过一次：
      4 月 25 日官方称只涵盖精炼棕榈油，4 月 27 日扩大到毛棕榈油。
      禁令期间国内库存积压。
    observations:
      - asset: 马来西亚棕榈油期货
        direction: up
        window: 1d-1w
        note: 4月25日盘中一度上涨约 6% 到 7%，因禁令范围被说成只含精炼油而收跌约 2%；4月27日范围扩大到毛棕榈油，当日触及涨停，收涨约 9.4%
        recall: medium
      - asset: 芝加哥豆油
        direction: up
        window: 1d-1w
        note: 作为替代品同步上涨，创历史新高
        recall: medium
      - asset: 马来西亚棕榈油期货
        direction: down
        window: 4w-8w
        note: 解禁后印尼出清积压库存，价格在 6 月大幅回落
        recall: medium
    lessons:
      - 出口禁令会在国内攒出库存，解禁后的抛压是可以预判的反向交易
      - 替代品和区域外的生产国是直接受益方
      - 政策的适用范围比政策本身更重要，首日的反应可能因为一句澄清而反转
    verification:
      status: web_checked
      checked_on: 2026-11-13
      sources:
        - "https://www.thestar.com.my/business/business-news/2022/04/26/cpo-futures-sees-bump-on-indonesias-ban"
        - "https://www.tridge.com/news/palm-oil-adds-nearly-3-as-market-estimates-indones"
        - "https://www.spglobal.com/energy/en/news-research/latest-news/agriculture/042722-indonesia-palm-oil-export-ban-to-include-crude-palm-oil-uco-markets-jump"
      notes: "核对后改正：宣布后的首个交易日其实收跌，持续的上涨出现在禁令扩大到毛棕榈油之后。"

  - id: russian_oil_embargo_2022
    title: 欧盟对俄海运原油禁运与限价生效
    start_date: 2022-12-05
    location: 欧盟、俄罗斯
    categories: [geopolitical, macro_policy]
    summary: >-
      禁运在 2022 年 6 月通过并设了半年过渡期，生效日期早已为人所知；
      每桶 60 美元的限价水平则直到 12 月 2 日才敲定。生效后俄油转向印度
      和中国，航程拉长。生效当周油价不涨反跌，当时的报道主要归因于需求
      与衰退担忧。
    observations:
      - asset: 布伦特原油
        asset_id: BRENT
        direction: down
        window: 1w
        note: 生效当周下跌，12月上旬跌至约 76 美元的年内低位
        recall: medium
      - asset: 乌拉尔原油相对布伦特的价差
        direction: down
        window: 4w-8w
        note: 折价扩大到每桶约 30 美元
        recall: medium
      - asset: 油轮运费与油轮股
        direction: up
        window: 4w-12w
        note: 贸易流向重排后航程拉长，运力需求上升
        recall: medium
    lessons:
      - 生效日期提前半年已知，生效当周没有出现供给恐慌；但当周的下跌主要来自需求担忧，不能简单算作预期兑现
      - 供给没有消失而是换了买家时，受益的是运输环节和拿到折价的买方
    verification:
      status: web_checked
      checked_on: 2026-11-13
      sources:
        - "https://www.arabnews.pk/node/2210046"
        - "https://www.cnbc.com/2022/12/09/oil-markets-keystone-pipeline-shutdown-global-demand-slowdown.html"
        - "https://www.spglobal.com/energy/en/news-research/latest-news/crude-oil/120922-asian-buyers-push-for-even-steeper-urals-discounts-after-g7-price-cap"
      notes: "核对后改正：限价水平在生效前三天才敲定；当周的下跌主要被归因于需求担忧。"
