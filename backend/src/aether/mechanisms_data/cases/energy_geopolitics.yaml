# 能源、航运通道、制裁与地缘冲突类案例。
cases:
  - id: abqaiq_attack_2019
    title: 沙特阿布盖格石油设施遇袭
    start_date: 2019-09-14
    end_date: 2019-09-30
    location: 沙特阿拉伯东部省
    categories: [geopolitical, industry_supply_chain]
    summary: >-
      无人机与导弹袭击阿布盖格加工厂和胡赖斯油田，约 570 万桶/日的产能
      中断，约占全球供应的 5%。沙特阿美在月底前恢复了产量。
    observations:
      - asset: 布伦特原油
        asset_id: BRENT
        direction: up
        window: 1d
        note: 9月16日开盘跳涨，盘中一度约 +20%，收涨约 14.6%，为有记录以来最大的单日涨幅之一
        recall: high
      - asset: 布伦特原油
        asset_id: BRENT
        direction: down
        window: 2w
        note: 约两周内回吐全部涨幅，月底回到遇袭前水平附近
        recall: high
      - asset: 石油生产商与能源板块
        direction: up
        window: 1d
        note: 随油价跳涨
        recall: medium
    lessons:
      - 决定涨幅能否保住的是恢复速度，而不是中断时的规模
      - 有闲置产能和库存缓冲时，约占全球 5% 的供给中断也可以在两周内被消化
    verification:
      status: web_checked
      checked_on: 2026-11-13
      sources:
        - "https://www.cnbc.com/2019/09/16/oil-markets-saudi-oil-plant-attacks-in-focus.html"
        - "https://www.eia.gov/todayinenergy/detail.php?id=41413"
        - "https://worldoil.com/news/2019/9/27/oil-erases-all-gains-made-since-saudi-attacks-as-tensions-thaw"

  - id: soleimani_strike_2020
    title: 美军击杀苏莱曼尼
    start_date: 2020-01-03
    end_date: 2020-01-08
    location: 伊拉克巴格达
    categories: [geopolitical]
    summary: >-
      美军空袭击杀伊朗圣城旅指挥官。伊朗 1 月 8 日以导弹袭击驻伊拉克美军
      基地作为报复，没有造成美军死亡，双方随后降级。石油供给始终没有受损。
    observations:
      - asset: 布伦特原油
        asset_id: BRENT
        direction: up
        window: 1d
        note: 1月3日上涨约 3.5%
        recall: medium
      - asset: 布伦特原油
        asset_id: BRENT
        direction: down
        window: 1w
        note: 1月8日盘中冲高到约 71 至 72 美元，确认没有美军伤亡后当日转跌，此后跌回事件前水平之下
        recall: medium
      - asset: 黄金
        asset_id: GOLD
        direction: up
        window: 3d-1w
        note: 1月8日盘中一度突破 1600 美元，随后回落
        recall: medium
    lessons:
      - 没有实物供给损失的地缘冲击，风险溢价通常在数日内回吐
      - 对方反击的规模是关键节点，象征性反击等于降级信号
    verification:
      status: web_checked
      checked_on: 2026-11-13
      sources:
        - "https://www.spglobal.com/energy/en/news-research/latest-news/crude-oil/010820-crude-falls-as-trump-softens-iran-rhetoric-after-attack-calls-for-talks"
        - "https://www.spglobal.com/energy/en/news-research/latest-news/metals/010820-gold-breaks-1600-as-usiran-tensions-rise-before-profit-taking"
        - "https://www.malaymail.com/news/money/2020/01/04/oil-safe-havens-surge-after-us-strikes-kill-iran-commander/1824529"

  - id: israel_iran_june_2025
    title: 以色列与伊朗十二日冲突
    start_date: 2025-06-13
    end_date: 2025-06-24
    location: 伊朗、以色列、波斯湾
    categories: [geopolitical]
    summary: >-
      以色列空袭伊朗核设施与军事目标，美国于 6 月 22 日加入打击。
      伊朗对卡塔尔美军基地的反击被视为象征性，6 月 24 日停火。
      霍尔木兹海峡始终开放，只在 6 月 23 日通行量一度明显下降。
    observations:
      - asset: 布伦特原油
        asset_id: BRENT
        direction: up
        window: 1d
        note: 6月13日收涨约 7%，盘中涨幅一度达两位数
        recall: medium
      - asset: 布伦特原油
        asset_id: BRENT
        direction: down
        window: 2d
        note: 6月23日单日下跌约 7%，24日停火后再跌，回到冲突前水平之下
        recall: medium
    lessons:
      - 市场定价的是海峡被封锁的概率，概率一旦回落，溢价会比上涨时更快地消失
    verification:
