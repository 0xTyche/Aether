  - id: russia_ukraine_2022
    title: 俄罗斯入侵乌克兰
    start_date: 2022-02-24
    location: 乌克兰、俄罗斯
    categories: [geopolitical, industry_supply_chain]
    summary: >-
      交战双方都是能源、粮食与金属的主要出口国，制裁与黑海航运中断造成
      真实的供给损失。大宗商品普涨，欧洲对俄暴露的资产下跌，军工与化肥
      受益。莫斯科交易所长时间停市。
    observations:
      - asset: 布伦特原油
        asset_id: BRENT
        direction: up
        window: 2w
        note: 3月7日盘中约 139 美元，为 2008 年以来最高
        recall: high
      - asset: 芝加哥小麦期货
        direction: up
        window: 2w
        note: 连续多日涨停，3月初创历史新高
        recall: high
      - asset: 欧洲天然气（TTF）
        direction: up
        window: 2w
        note: 3月7日盘中一度约 345 欧元/兆瓦时
        recall: medium
      - asset: 伦敦镍
        direction: up
        window: 2d
        note: 3月7日至8日暴涨，盘中突破每吨 10 万美元，交易所暂停交易并取消了3月8日的成交
        recall: high
      - asset: 钯金
        direction: up
        window: 2w
        note: 3月7日创约 3440 美元的历史高位
        recall: medium
      - asset: 欧洲军工股（莱茵金属等）
        direction: up
        window: 1w-4w
        note: 德国宣布 1000 亿欧元国防特别基金后大涨
        recall: high
      - asset: 化肥生产商（钾肥、氮肥）
        direction: up
        window: 2w-8w
        note: 俄罗斯与白俄罗斯是钾肥主要出口国，天然气涨价又推高氮肥成本
        recall: medium
      - asset: 莫斯科交易所股票
        direction: flat
        window: 4w
        note: 2月28日起股票市场停市，3月24日才部分恢复
        recall: high
    lessons:
      - 有真实供给损失时，溢价不会像纯风险事件那样在数日内回吐
      - 逼空与交易所取消成交说明，方向判断正确也可能拿不到利润
      - 被制裁方的资产往往直接停市，可交易的是第三方
    verification:
      status: web_checked
      checked_on: 2026-11-13
      sources:
        - "https://think.ing.com/snaps/the-commodities-feed-nickel-surges-to-record-levels/"
        - "https://www.spglobal.com/commodityinsights/en/market-insights/latest-news/metals/030822-lme-suspends-nickel-trading-after-unprecedented-surge-to-above-100000mt"
        - "https://www.themoscowtimes.com/2022/03/23/russian-stock-market-to-reopen-thursday-after-unprecedented-pause-a77050"
      notes: "化肥股数周内的累计涨幅未核对。"

  - id: suez_ever_given_2021
    title: 长赐号堵塞苏伊士运河
    start_date: 2021-03-23
    end_date: 2021-03-29
    location: 埃及苏伊士运河
    categories: [industry_supply_chain]
    summary: >-
      超大型集装箱船搁浅，运河堵塞 6 天，约 400 艘船滞留。
      中断时间太短，对大宗商品价格没有形成持续影响。
    observations:
      - asset: 布伦特原油
        asset_id: BRENT
        direction: up
        window: 1d
        note: 3月24日上涨约 6%，次日下跌约 3.8%，后者主要被归因于欧洲封锁带来的需求担忧
        recall: medium
      - asset: 亚欧航线集装箱运价
        direction: up
        window: 2w-6w
        note: 运价原本已处高位，堵塞加剧了舱位和空箱紧张
        recall: medium
    lessons:
      - 中断的持续时间是关键变量，6 天不足以形成持续的价格冲击
    verification:
      status: web_checked
      checked_on: 2026-11-13
      sources:
        - "https://en.wikipedia.org/wiki/2021_Suez_Canal_obstruction"
        - "https://www.petroleumnews.com/pnarchpop/535381579.shtml"
        - "https://www.worldoil.com/news/2021/3/25/oil-prices-retreat-as-suez-blockage-ramps-up-volatility"
      notes: "集装箱运价一条未核对。"

  - id: red_sea_houthi_2023
    title: 胡塞武装袭击红海商船
    start_date: 2023-11-19
    location: 红海与曼德海峡
    categories: [geopolitical, industry_supply_chain]
    summary: >-
      2023 年 11 月起商船接连遇袭，12 月中旬主要班轮公司宣布绕行好望角。
      2024 年初苏伊士运河通行量同比下降约一半。货物没有消失，只是航程
      变长，所以受益的是运价，原油价格基本没有反应。
    observations:
      - asset: 上海至北欧集装箱运价
        direction: up
        window: 4w-8w
        note: 12月中旬宣布绕行后，约一个月内升到原来的三倍左右
        recall: medium
      - asset: 班轮公司股票（马士基、赫伯罗特、以星）
        direction: up
        window: 2w-6w
        note: 以星航运在 12 月至次年 1 月间大致翻倍
        recall: medium
      - asset: 布伦特原油
        asset_id: BRENT
        direction: flat
        window: 4w
        note: 原油供给没有减少，价格反应有限
        recall: medium
    lessons:
      - 通道受阻但可以绕行时，受益的是承运方，受损的是货主，商品价格本身未必变化
      - 从首次袭击到班轮公司宣布绕行隔了近一个月，运价是在后者之后才大涨的
    verification:
      status: web_checked
      checked_on: 2026-11-13
      sources:
        - "https://www.imf.org/en/Blogs/Articles/2024/03/07/Red-Sea-Attacks-Disrupt-Global-Trade"
        - "https://www.lloydslist.com/LL1147832/Box-freight-rates-rise-again-as-diversions-resume"
        - "https://www.aljazeera.com/features/2023/12/16/analysis-what-do-houthi-attacks-in-the-red-sea-mean-for-oil-prices"
      notes: "马士基与赫伯罗特的股价未核对，以星航运已核实。"

  - id: baltimore_bridge_2024
    title: 巴尔的摩大桥垮塌封港
    start_date: 2024-03-26
    end_date: 2024-06-10
    location: 美国巴尔的摩港
    categories: [industry_supply_chain]
    summary: >-
      货轮撞塌大桥，航道完全恢复用了约 11 周，4 月下旬起先开放了临时的
      限制性航道。巴尔的摩是美国第二大煤炭出口港，也是最大的汽车进出口
      港，货物改道东岸其他港口。
    observations:
      - asset: 依赖该港出口的煤炭企业（CONSOL Energy）
        direction: down
        window: 1d
        note: 当日下跌约 7%
        recall: medium
      - asset: 全球海运动力煤价格
        direction: flat
        window: 1w-2w
        note: 该港出口量占全球份额很小，价格影响有限
        recall: low
    lessons:
      - 对依赖单一港口的企业是特质性利空，对全球商品价格则要先做规模核查
    verification:
      status: web_checked
      checked_on: 2026-11-13
      sources:
        - "https://www.cbsnews.com/baltimore/news/main-channel-to-port-of-baltimore-fully-restored-11-weeks-after-key-bridge-collapse/"
        - "https://www.usitc.gov/sites/default/files/publications/332/executive_briefings/ebot_baltimore_bridge_coal.pdf"
