# 个股财报溢出、指数纳入与科技出口管制类案例。
cases:
  - id: nvda_guidance_may_2023
    title: 英伟达大幅上调营收指引
    start_date: 2023-05-24
    location: 美国
    categories: [company_specific, industry_supply_chain]
    summary: >-
      盘后给出的下一季营收指引远高于市场预期，确认了人工智能算力需求。
      次日同业与代工厂同步大涨，被视为份额流失方的英特尔下跌。更远的
      供应链环节在随后数周到数月才被陆续重新定价。
    observations:
      - asset: 英伟达
        asset_id: NVDA
        direction: up
        window: 1d
        note: 次日上涨约 24%
        recall: high
      - asset: 超威半导体
        asset_id: AMD
        direction: up
        window: 1d
        note: 次日上涨约 11%
        recall: high
      - asset: 台积电 ADR
        asset_id: TSM
        direction: up
        window: 1d
        note: 次日上涨约 12%
        recall: medium
      - asset: 英特尔
        asset_id: INTC
        direction: down
        window: 1d
        note: 次日下跌约 5.5%
        recall: medium
      - asset: 光模块、服务器、电源与散热等二三线供应链
        direction: up
        window: 4w-24w
        note: 在随后数周到数月被陆续重新定价
        recall: medium
    lessons:
      - 最直接的同业当天就反应完毕，越远的环节被定价得越晚
      - 同一条利好对份额流失方是利空
    verification:
      status: web_checked
      checked_on: 2026-11-13
      sources:
        - "https://www.bnnbloomberg.ca/intel-risks-being-left-behind-as-nvidia-ups-ai-lead-1.1925235"
        - "https://finance.technews.tw/2023/05/26/tsmc-stock-price-568/"
      notes: "二三线供应链的后续走势未核对。个股涨跌幅另对照了公开的日线行情。"

  - id: asml_orders_miss_2024
    title: 阿斯麦订单远低于预期
    start_date: 2024-10-15
    location: 荷兰
    categories: [company_specific, industry_supply_chain]
    summary: >-
      财报因技术失误提前一天发布，新增订单不到市场预期的一半，并下调
      次年指引。设备同业当日普跌，日本同业在次日开盘后跟跌。
    observations:
      - asset: 阿斯麦
        direction: down
        window: 1d
        note: 当日下跌约 16%
        recall: high
      - asset: 美国半导体设备同业（应用材料、泛林、科磊）
        direction: down
        window: 1d
        note: 各自下跌约一成到一成五
        recall: medium
      - asset: 东京电子
        direction: down
        window: 1d
        note: 次日下跌约 9%
        recall: medium
      - asset: 英伟达
        asset_id: NVDA
        direction: down
        window: 1d
        note: 当日下跌约 4.7%；同日另有美国考虑限制人工智能芯片出口的报道，不能只归因于阿斯麦
        recall: medium
    lessons:
      - 消息出在某个时区收盘之后，另一个时区的同业到开盘才反应，中间有数小时
      - 未按预定时间发布的信息没有人提前布局，反应更剧烈
    verification:
      status: web_checked
      checked_on: 2026-11-13
      sources:
        - "https://finance.technews.tw/2024/10/16/usa-stock-market-16th-october/"
        - "https://www.bloomberg.com/news/articles/2024-10-15/asml-orders-miss-as-chip-industry-weakness-weighs-on-demand"
        - "https://theprint.in/tech/chip-stocks-fall-on-asml-forecast-cut-potential-us-ai-chip-export-cap/2313255"

  - id: tesla_sp500_inclusion_2020
    title: 特斯拉被纳入标普500
    start_date: 2020-11-16
    end_date: 2020-12-21
    location: 美国
    categories: [market_structure_liquidity, company_specific]
    summary: >-
      标普道琼斯指数公司在 11 月 16 日盘后宣布，12 月 21 日生效。
      宣布到生效之间股价持续上涨，生效当日下跌。
    observations:
      - asset: 特斯拉
        asset_id: TSLA
        direction: up
        window: 1d
        note: 宣布后的首个交易日上涨约 8%
        recall: high
      - asset: 特斯拉
        asset_id: TSLA
        direction: up
        window: 5w
        note: 宣布到纳入前累计上涨约 70%
        recall: medium
      - asset: 特斯拉
        asset_id: TSLA
        direction: down
        window: 1d
        note: 纳入生效的首个交易日下跌约 6.5%
        recall: high
    lessons:
      - 宣布日和生效日之间的被动买盘是时间和方向都可知的资金流
      - 生效日本身常是买盘出清的时点
    verification:
      status: web_checked
      checked_on: 2026-11-13
      sources:
        - "https://www.brecorder.com/news/40043572"
        - "https://www.aljazeera.com/economy/2020/11/16/tesla-shares-up-12-after-announcement-it-will-zoom-onto-sp-500"
      notes: "涨跌幅另对照了公开的日线行情。约 70% 的累计涨幅是从宣布日收盘算起，从次日收盘算起约为 57%。"

