  - id: huawei_entity_list_2019
    title: 华为被列入实体清单
    start_date: 2019-05-15
    location: 美国、中国
    categories: [geopolitical, industry_supply_chain]
    summary: >-
      美国商务部限制向华为供货，对华为收入依赖度高的美国零部件供应商
      下跌，半导体板块全月走弱。
    observations:
      - asset: 华为的美国供应商（Lumentum、Qorvo、Skyworks、美光等）
        direction: down
        window: 1w
        note: 多数在一周内下跌一成到两成，其中 Lumentum 约两成
        recall: medium
      - asset: 费城半导体指数
        direction: down
        window: 4w
        note: 5 月全月下跌约 16.7%，其中5月15日之后的跌幅约 11%，其余来自此前的关税升级
        recall: medium
      - asset: A 股国产替代相关板块
        direction: up
        window: 1w-4w
        note: 自主可控概念上涨
        recall: low
    lessons:
      - 管制对出口方供应商的打击按其对被管制客户的收入占比排序，这份占比是公开数据
      - 被管制方的本土替代者是反向受益方
    verification:
      status: web_checked
      checked_on: 2026-11-13
      sources:
        - "https://www.cov.com/-/media/files/corporate/publications/2019/05/commerce_department_adds_huawei_and_68_huawei_affiliates_to_entity_list.pdf"
        - "https://www.bloombergquint.com/markets/tech-loses-half-a-trillion-in-market-cap-in-a-month-to-forget"
        - "https://www.nbd.com.cn/articles/2019-05-17/1332680.html"
      notes: "Qorvo 的确切跌幅未能取得。核对后补充了指数跌幅的归因。"

  - id: us_chip_export_rules_2022
    title: 美国对华先进芯片出口管制
    start_date: 2022-10-07
    location: 美国、中国
    categories: [geopolitical, industry_supply_chain]
    summary: >-
      美国商务部限制先进芯片、制造设备与美籍人员对华提供支持。
      美国设备商随后披露营收影响，中国半导体股在长假后首日大跌。
    observations:
      - asset: 费城半导体指数
        direction: down
        window: 2d
        note: 10月7日与10日两个交易日合计下跌约 9%；10月7日同时受到超威半导体营收预警的影响
        recall: medium
      - asset: 美国半导体设备商（应用材料、泛林、科磊）
        direction: down
        window: 1w-4w
        note: 随后下调营收预期，各自披露数亿到二十余亿美元的影响
        recall: medium
      - asset: 中国半导体设备与制造股
        direction: down
        window: 1d
        note: 10月10日长假后首个交易日大跌，部分个股跌停
        recall: medium
      - asset: 中国国产设备与材料股
        direction: up
        window: 20w-28w
        note: 以北方华创为例，12 周后仍在低位，回升出现在 2023 年 3 月到 4 月
        recall: low
    lessons:
      - 规则在美国周五公布，中国市场要到下周一才能交易，周末和假期造成了定价延迟
      - 短期利空与中期替代受益可以落在同一批公司身上，方向随窗口翻转
    verification:
      status: web_checked
      checked_on: 2026-11-13
      sources:
        - "https://www.advisorperspectives.com/articles/2022/10/10/us-chipmakers-stocks-join-global-rout-as-biden-expands-curbs"
        - "https://www.chronicle.lu/category/international-news/42821-china-tech-shares-sink-as-us-export-curbs-raise-chip-sector-hurdles"
        - "https://www.sec.gov/Archives/edgar/data/319201/000162828022027311/klac-20220930.htm"
      notes: "国产设备股的回升只核对了北方华创一只，板块整体未能核实；核对后把回升的时间窗口向后调整。"

  - id: china_gallium_germanium_2023
    title: 中国对镓、锗实施出口管制
    start_date: 2023-07-03
    end_date: 2023-08-01
    location: 中国
    categories: [geopolitical, industry_supply_chain]
    summary: >-
      中国宣布自 8 月 1 日起对镓、锗相关物项实行出口许可，中国在这两种
      金属的全球产量中占绝大多数。
    observations:
      - asset: A 股镓、锗相关公司
        direction: up
        window: 1d
        note: 宣布后的首个交易日，云南锗业涨停，驰宏锌锗盘中触及涨停后收涨约 6%
        recall: medium
      - asset: 镓、锗的海外现货价
        direction: up
        window: 4w-12w
        note: 生效前后海外价格走高
        recall: medium
      - asset: 中国以外的小型生产商
        direction: up
        window: 1d-1w
        note: 短线上涨
        recall: low
    lessons:
      - 宣布日到生效日之间有四周，海外买家抢购备货的行为可以预判
      - 管制方的本土生产商和区域外的生产商都可能上涨，原因不同
    verification:
      status: web_checked
      checked_on: 2026-11-13
      sources:
        - "https://yicaiglobal.com/news/20230704-02-chinese-gallium-germanium-giants-soar-as-china-says-to-control-export-of-key-semiconductor-materials"
        - "https://www.aol.com/beijing-jabs-us-china-tech-030638393.html"
        - "https://fortune.com/2023/07/07/china-export-controls-gallium-price-jump-tech-industries/"
      notes: "中国在两种金属产量中的占比只找到一个来源。"
